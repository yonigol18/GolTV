<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Selection</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents scrolling so everything stays on a single screen */
            background-color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: blue;
            margin-bottom: 20px;
            font-size: 2rem;
            text-align: center;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 25px; /* Adjusted spacing to accommodate larger tiles on screen */
            width: 90%;
            max-width: 400px;
        }
        .buttons a {
            text-decoration: none;
            padding: 52px 15px; /* Doubled height (vertical padding went from 26px to 52px) */
            color: white;
            background-color: #007AFF; /* Modern iOS-friendly blue */
            border-radius: 16px;
            font-size: 1.8rem; /* Slightly increased text size */
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transition: background-color 0.2s, transform 0.1s;
        }
        .buttons a:active {
            transform: scale(0.97);
        }
        .buttons a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>PLAY CHANNEL</h1>
    <div class="buttons">

        <a href="https://i24newsenglish-cdn.encoders.immergo.tv/master.m3u8">i24 ENGLISH</a>
        <a href="https://n-121-4.il.cdn-redge.media/livehls/oil/kancdn-live/live/radio/kan_reshet_bet/live.livx/playlist.m3u8?bitrate=192000&audioId=1&lang=pol&renditions">RESHET BET</a>
        <a href="https://n-121-5.il.cdn-redge.media/livedash/oil/kancdn-live/live/radio/kan_kol_hamuzika/live.livx?type=audio&ft=1&id=1&bitrate=192000&idx=202792230">KOL HA MUZIKA</a>
    </div>
</body>
</html>
